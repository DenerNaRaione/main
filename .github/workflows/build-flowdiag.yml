name: Build FlowDiag Balance 3

on:
  push:
    branches: [flowconfig-balance3-autodetect]
    paths:
      - 'flowdiag/**'
      - '.github/workflows/build-flowdiag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flowconfig-balance3-autodetect
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare icon
        working-directory: flowdiag
        run: |
          mkdir -p assets/base
          python3 - <<'PY'
          import struct,zlib
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          raw=b'\x00\x2f\x80\xed\xff'
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',1,1,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          open('assets/base/icon.png','wb').write(png)
          PY
      - name: Install dependencies
        working-directory: flowdiag
        run: |
          npm install --no-audit --no-fund
          rm -rf node_modules/zeppos-app-utils
          ln -s @zeppos/zeus-cli/private-modules/zeppos-app-utils node_modules/zeppos-app-utils
      - name: Build
        working-directory: flowdiag
        run: printf '\n' | npm run build
      - name: Show output
        working-directory: flowdiag
        run: find dist -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Commit ZAB output
        run: |
          cp flowdiag/dist/*.zab FlowDiag_Balance3.zab
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FlowDiag_Balance3.zab
          git commit -m 'Build FlowDiag Balance 3 package' || exit 0
          git push
