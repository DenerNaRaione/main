name: Assemble FlowConfig temporary package

on:
  push:
    branches:
      - flowconfig-balance3-temp
    paths:
      - ".github/workflows/assemble-flowconfig.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify ZPK
        shell: bash
        run: |
          cat tmp_flowconfig/chunk*.b64 | base64 -d > FlowConfig_Balance3_11141379_preview.zpk
          echo "F7583BCEE3BD1F5816A805059CF449610B27FF2714457A52546E339C689EB92D  FlowConfig_Balance3_11141379_preview.zpk" | sha256sum -c -

      - name: Commit temporary package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FlowConfig_Balance3_11141379_preview.zpk
          git commit -m "Assemble temporary FlowConfig Balance 3 package"
          git push
